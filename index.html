<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espectrógrafo - CulturaCrítica</title>
    <!-- Librería de Sonido -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <!-- Librerías de Inteligencia Artificial (Cámara y Manos) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <style>
        body { 
            margin: 0; background-color: #121212; color: #00FF88; font-family: sans-serif; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100vh; overflow: hidden; 
        }
        #startBtn { 
            padding: 15px 30px; font-size: 1.2rem; background-color: #00FF88; color: black; 
            border: none; border-radius: 8px; font-weight: bold; cursor: pointer; z-index: 10; 
            box-shadow: 0 4px 15px rgba(0, 255, 136, 0.4);
        }
        canvas { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            object-fit: cover; z-index: 1; opacity: 0.6; transform: scaleX(-1);
        }
        video { display: none; }
        #status { 
            position: absolute; top: 20px; z-index: 10; background: rgba(0,0,0,0.7); 
            padding: 10px 20px; border-radius: 8px; font-weight: bold; border: 1px solid #00FF88;
        }
    </style>
</head>
<body>
    <div id="status">Esperando activación...</div>
    <button id="startBtn">Activar Espectrógrafo Armonioso</button>
    <video id="input_video"></video>
    <canvas id="output_canvas"></canvas>

    <script>
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const startBtn = document.getElementById('startBtn');
        const statusTxt = document.getElementById('status');

        let synth;
        
        // ESCALA PENTATÓNICA MÁGICA: Estas notas jamás suenan mal juntas.
        // C6 (Agudo arriba) hasta C4 (Grave abajo)
        const notasMusicales = ["C6", "A5", "G5", "E5", "D5", "C5", "A4", "G4", "E4", "D4", "C4"];
        let ultimaNotaTocada = null;

        // 1. INICIAR EL AUDIO 
        startBtn.addEventListener('click', async () => {
            await Tone.start(); 
            
            // EFECTOS PARA QUE SUENE RELAJANTE Y ESPACIAL:
            // Le ponemos Reverb (Eco de cuarto grande) y Delay (Repeticiones suaves)
            const reverb = new Tone.Reverb({ decay: 4, wet: 0.6 }).toDestination();
            const delay = new Tone.FeedbackDelay("8n", 0.4).connect(reverb);
            
            // Cambiamos el sintetizador agresivo por uno de "onda suave" (sine wave)
            synth = new Tone.PolySynth(Tone.Synth, {
                oscillator: { type: "sine" }, 
                envelope: { attack: 0.05, decay: 0.5, sustain: 0.1, release: 2 } // Desvanecimiento lento
            }).connect(delay);
            
            startBtn.style.display = 'none';
            statusTxt.innerText = "Cargando Inteligencia Artificial...";
            startCamera();
        });

        // 2. LÓGICA DE DIBUJO Y SONIDO CUANDO DETECTA LA MANO
        function onResults(results) {
            canvasElement.width = videoElement.videoWidth;
            canvasElement.height = videoElement.videoHeight;
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                
                // Dibujar los puntos de la mano
                for (let i = 0; i < landmarks.length; i++) {
                    const x = landmarks[i].x * canvasElement.width;
                    const y = landmarks[i].y * canvasElement.height;
                    canvasCtx.beginPath();
                    canvasCtx.arc(x, y, 6, 0, 2 * Math.PI);
                    canvasCtx.fillStyle = '#00FF88';
                    canvasCtx.fill();
                }

                // Usamos la altura del dedo índice (punto 8)
                const indexFinger = landmarks[8];
                
                // Dividimos la pantalla en "Zonas" (como las cuerdas de un arpa)
                // Dependiendo de a qué altura esté el dedo, calculamos qué cuerda está tocando
                const zonaActual = Math.floor(indexFinger.y * notasMusicales.length);
                const zonaSegura = Math.max(0, Math.min(notasMusicales.length - 1, zonaActual));
                const notaActual = notasMusicales[zonaSegura];

                // Solo suena si el dedo cambió de zona (como rasgar una cuerda nueva)
                if (notaActual !== ultimaNotaTocada) {
                    if (synth) {
                        synth.triggerAttackRelease(notaActual, "8n");
                    }
                    ultimaNotaTocada = notaActual;
                    statusTxt.innerText = `Armonía: ${notaActual}`;
                }
            } else {
                ultimaNotaTocada = null; // Resetea si quitas la mano
                statusTxt.innerText = "Toca las cuerdas invisibles.";
            }
            canvasCtx.restore();
        }

        // 3. CONFIGURAR LA IA DE GOOGLE MEDIAPIPE
        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        hands.onResults(onResults);

        // 4. ENCENDER LA CÁMARA
        function startCamera() {
            const camera = new Camera(videoElement, {
                onFrame: async () => { await hands.send({image: videoElement}); },
                width: 640, height: 480
            });
            camera.start().then(() => { statusTxt.innerText = "¡Mueve tu dedo arriba y abajo!"; });
        }
    </script>
</body>
</html>
