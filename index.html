<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sintetizador de 10 Dedos - CulturaCrítica</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; }
        #startBtn { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); 
            padding: 20px 40px; background: #00FF88; color: black; border: none; 
            border-radius: 12px; font-size: 1.2rem; font-weight: bold; z-index: 10; cursor: pointer; 
        }
        #output_canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; transform: scaleX(-1); }
        #status { 
            position: absolute; top: 20px; left: 20px; color: #fff; background: rgba(0,0,0,0.8); 
            padding: 15px; border-radius: 8px; z-index: 5; font-size: 1.1rem; font-weight: bold; border: 1px solid #00FF88;
        }
    </style>
</head>
<body>
    <div id="status">Esperando...</div>
    <button id="startBtn">INICIAR GUITARRA / SYNTH</button>
    <video id="input_video" style="display:none;"></video>
    <canvas id="output_canvas"></canvas>

    <script>
        const statusTxt = document.getElementById('status');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        
        const reverb = new Tone.Reverb(2.5).toDestination();
        
        // --- INSTRUMENTOS ---
        // Mano Izquierda (GUITARRA ACÚSTICA SIMULADA)
        const synthGuitar = new Tone.PolySynth(Tone.PluckSynth, {
            attackNoise: 1, dampening: 4000, resonance: 0.9
        }).connect(reverb);

        // Mano Derecha (SYNTH PROFUNDO ORIGINAL)
        const synthPad = new Tone.PolySynth(Tone.FMSynth, {
            oscillator: { type: "sine" }, envelope: { attack: 0.1, release: 1 }
        }).connect(reverb);
        
        // --- ASIGNACIÓN DE NOTAS POR DEDO ---
        // Dedo: [0:Pulgar, 1:Índice, 2:Medio, 3:Anular, 4:Meñique]
        const leftNotes  = ["C3", "E3", "G3", "B3", "D4"]; // Acorde de Cmaj9 (Guitarra Grave)
        const rightNotes = ["C4", "E4", "G4", "B4", "D5"]; // Acorde de Cmaj9 (Synth Agudo)

        // Memoria para saber qué dedos están tocando en este milisegundo
        let activeFingers = { "Left": [false,false,false,false,false], "Right": [false,false,false,false,false] };

        document.getElementById('startBtn').onclick = async () => {
            await Tone.start();
            document.getElementById('startBtn').style.display = 'none';
            statusTxt.innerText = "Levanta los dedos para tocar";
            startCamera();
        };

        function isFingerExtended(landmarks, fingerTipIndex, fingerBaseIndex) {
            // Un dedo (excepto el pulgar) se considera estirado si su punta está más arriba que su nudillo central
            // Y de MediaPipe disminuye hacia arriba.
            return landmarks[fingerTipIndex].y < landmarks[fingerBaseIndex].y;
        }

        function isThumbExtended(landmarks, handedness) {
            // El pulgar se evalúa horizontalmente (X) respecto al nudillo del meñique
            // Depende de qué mano sea (por el efecto espejo)
            if (handedness === 'Left') {
                return landmarks[4].x < landmarks[17].x; 
            } else {
                return landmarks[4].x > landmarks[17].x;
            }
        }

        function onResults(results) {
            canvasElement.width = results.image.width;
            canvasElement.height = results.image.height;
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
                synthGuitar.releaseAll(); synthPad.releaseAll();
                activeFingers = { "Left": [false,false,false,false,false], "Right": [false,false,false,false,false] };
                statusTxt.innerText = "Muestra tus manos";
                return;
            }

            let textInfo = "";
            // Leemos el estado actual de los dedos en este frame
            let currentFingers = { "Left": [false,false,false,false,false], "Right": [false,false,false,false,false] };

            for (let i = 0; i < results.multiHandLandmarks.length; i++) {
                const landmarks = results.multiHandLandmarks[i];
                const handedness = results.multiHandedness[i].label; // Left (Guitarra) o Right (Synth)
                
                const handColor = (handedness === 'Left') ? '#00FF88' : '#FF3366';
                drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: handColor, lineWidth: 3});
                drawLandmarks(canvasCtx, landmarks, {color: '#FFFFFF', lineWidth: 1, radius: 3});

                // Detectar qué dedos están levantados
                currentFingers[handedness][0] = isThumbExtended(landmarks, handedness); // Pulgar (4)
                currentFingers[handedness][1] = isFingerExtended(landmarks, 8, 6);      // Índice (8)
                currentFingers[handedness][2] = isFingerExtended(landmarks, 12, 10);    // Medio (12)
                currentFingers[handedness][3] = isFingerExtended(landmarks, 16, 14);    // Anular (16)
                currentFingers[handedness][4] = isFingerExtended(landmarks, 20, 18);    // Meñique (20)

                // Lógica de Sonido: Comparamos el estado actual con el estado anterior
                let handInstrument = (handedness === 'Left') ? synthGuitar : synthPad;
                let handNotes = (handedness === 'Left') ? leftNotes : rightNotes;
                let handText = (handedness === 'Left') ? "🎸 Izq: " : "🎹 Der: ";
                let notasTocando = [];

                for (let finger = 0; finger < 5; finger++) {
                    let wasPlaying = activeFingers[handedness][finger];
                    let isPlaying = currentFingers[handedness][finger];
                    let note = handNotes[finger];

                    if (isPlaying && !wasPlaying) {
                        // El dedo acaba de levantarse -> Atacar nota
                        handInstrument.triggerAttack(note);
                    } else if (!isPlaying && wasPlaying) {
                        // El dedo acaba de bajar -> Soltar nota
                        handInstrument.triggerRelease(note);
                    }

                    if (isPlaying) notasTocando.push(note);
                }

                if (notasTocando.length > 0) textInfo += handText + notasTocando.join(", ") + " | ";
            }

            // Actualizamos la memoria para el próximo frame
            activeFingers = currentFingers;

            if (textInfo !== "") statusTxt.innerText = textInfo;
            else statusTxt.innerText = "Manos listas (levanta los dedos)";
        }

        const hands = new Hands({locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
        hands.setOptions({ maxNumHands: 2, modelComplexity: 1 });
        hands.onResults(onResults);

        function startCamera() {
            new Camera(document.getElementById('input_video'), { 
                onFrame: async () => await hands.send({image: document.getElementById('input_video')}),
            }).start();
        }
    </script>
</body>
</html>
