<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sintetizador de 10 Dedos - CulturaCrítica</title>
    <!-- Librerías Externas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; }
        #startBtn { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); 
            padding: 20px 40px; background: #00FF88; color: black; border: none; 
            border-radius: 12px; font-size: 1.2rem; font-weight: bold; z-index: 10; cursor: pointer; 
        }
        #output_canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; transform: scaleX(-1); }
        #status { 
            position: absolute; top: 20px; left: 20px; color: #fff; background: rgba(0,0,0,0.8); 
            padding: 15px; border-radius: 8px; z-index: 5; font-size: 1.1rem; font-weight: bold; border: 1px solid #00FF88;
        }
    </style>
</head>
<body>
    <div id="status">Esperando activación...</div>
    <button id="startBtn">INICIAR GUITARRA / SYNTH</button>
    <!-- playsinline es clave en móviles para que no se trabe el video oculto -->
    <video id="input_video" style="display:none;" playsinline></video>
    <canvas id="output_canvas"></canvas>

    <script>
        const statusTxt = document.getElementById('status');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const videoElement = document.getElementById('input_video');
        const startBtn = document.getElementById('startBtn');
        
        const reverb = new Tone.Reverb(2.5).toDestination();
        
        // --- 1. INSTRUMENTOS MEJORADOS ---
        // Mano Izquierda: Simulación de Guitarra (Triángulo con golpe seco y sin cola)
        const synthGuitar = new Tone.PolySynth(Tone.Synth, {
            oscillator: { type: "triangle" },
            envelope: { attack: 0.01, decay: 0.5, sustain: 0, release: 0.1 }
        }).connect(reverb);

        // Mano Derecha: Synth Pad (FMSynth espacial y suave)
        const synthPad = new Tone.PolySynth(Tone.FMSynth, {
            oscillator: { type: "sine" },
            envelope: { attack: 0.1, decay: 0.2, sustain: 0.8, release: 1 }
        }).connect(reverb);
        
        // --- 2. ASIGNACIÓN DE NOTAS (Acordes) ---
        const leftNotes  = ["C3", "E3", "G3", "B3", "D4"]; // Pulgar a Meñique
        const rightNotes = ["C4", "E4", "G4", "B4", "D5"];

        let activeFingers = { "Left": [false,false,false,false,false], "Right": [false,false,false,false,false] };

        // --- 3. INICIO SEGURO ---
        startBtn.addEventListener('click', async () => {
            try {
                startBtn.style.display = 'none';
                statusTxt.innerText = "[1/3] Iniciando motor de Audio...";
                await Tone.start();
                
                statusTxt.innerText = "[2/3] Conectando cámara...";
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                videoElement.srcObject = stream;
                
                statusTxt.innerText = "[3/3] Descargando IA (Espera)...";
                startCamera();
            } catch (error) {
                statusTxt.innerText = "❌ ERROR: " + error.message;
                statusTxt.style.color = "#FF3366";
                startBtn.style.display = 'block';
                startBtn.innerText = "REINTENTAR";
            }
        });

        // --- 4. LÓGICA DE DETECCIÓN DE DEDOS ---
        function isFingerExtended(landmarks, tipIndex, baseIndex) {
            return landmarks[tipIndex].y < landmarks[baseIndex].y;
        }

        function isThumbExtended(landmarks, handedness) {
            if (handedness === 'Left') return landmarks[4].x < landmarks[17].x; 
            else return landmarks[4].x > landmarks[17].x;
        }

        function onResults(results) {
            if (statusTxt.innerText.includes("Descargando IA")) {
                statusTxt.innerText = "✅ ¡Listo! Levanta los dedos.";
            }

            canvasElement.width = results.image.width;
            canvasElement.height = results.image.height;
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
                synthGuitar.releaseAll(); synthPad.releaseAll();
                activeFingers = { "Left": [false,false,false,false,false], "Right": [false,false,false,false,false] };
                if (!statusTxt.innerText.includes("Descargando")) {
                    statusTxt.innerText = "Muestra tus manos";
                }
                return;
            }

            let textInfo = "";
            let currentFingers = { "Left": [false,false,false,false,false], "Right": [false,false,false,false,false] };

            for (let i = 0; i < results.multiHandLandmarks.length; i++) {
                const landmarks = results.multiHandLandmarks[i];
                const handedness = results.multiHandedness[i].label; 
                
                const handColor = (handedness === 'Left') ? '#00FF88' : '#FF3366';
                drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: handColor, lineWidth: 3});
                drawLandmarks(canvasCtx, landmarks, {color: '#FFFFFF', lineWidth: 1, radius: 4});

                currentFingers[handedness][0] = isThumbExtended(landmarks, handedness); // Pulgar
                currentFingers[handedness][1] = isFingerExtended(landmarks, 8, 6);      // Índice
                currentFingers[handedness][2] = isFingerExtended(landmarks, 12, 10);    // Medio
                currentFingers[handedness][3] = isFingerExtended(landmarks, 16, 14);    // Anular
                currentFingers[handedness][4] = isFingerExtended(landmarks, 20, 18);    // Meñique

                let handInstrument = (handedness === 'Left') ? synthGuitar : synthPad;
                let handNotes = (handedness === 'Left') ? leftNotes : rightNotes;
                let handText = (handedness === 'Left') ? "🎸 Izq: " : "🎹 Der: ";
                let notasTocando = [];

                for (let finger = 0; finger < 5; finger++) {
                    let wasPlaying = activeFingers[handedness][finger];
                    let isPlaying = currentFingers[handedness][finger];
                    let note = handNotes[finger];

                    // Solo ataca si acaba de levantarse, y suelta si acaba de bajarse
                    if (isPlaying && !wasPlaying) handInstrument.triggerAttack(note);
                    else if (!isPlaying && wasPlaying) handInstrument.triggerRelease(note);

                    if (isPlaying) notasTocando.push(note);
                }
                if (notasTocando.length > 0) textInfo += handText + notasTocando.join(", ") + " | ";
            }

            activeFingers = currentFingers;
            if (textInfo !== "") statusTxt.innerText = textInfo;
            else statusTxt.innerText = "Manos listas (levanta los dedos)";
        }

        const hands = new Hands({locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
        hands.setOptions({ maxNumHands: 2, modelComplexity: 1 });
        hands.onResults(onResults);

        function startCamera() {
            new Camera(videoElement, { 
                onFrame: async () => await hands.send({image: videoElement}),
            }).start();
        }
    </script>
</body>
</html>
