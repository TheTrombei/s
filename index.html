<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Espectrógrafo - CulturaCrítica</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; }
        #startBtn { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); padding: 20px; font-weight: bold; z-index: 10; cursor: pointer; }
        #output_canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; transform: scaleX(-1); }
        #status { position: absolute; top: 10px; left: 10px; color: #00FF88; background: rgba(0,0,0,0.5); padding: 5px; z-index: 5; }
    </style>
</head>
<body>
    <div id="status">Cargando...</div>
    <button id="startBtn">INICIAR SINTETIZADOR</button>
    <video id="input_video" style="display:none;"></video>
    <canvas id="output_canvas"></canvas>

    <script>
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const synthRight = new Tone.PolySynth(Tone.Synth).toDestination();
        const synthLeft = new Tone.PolySynth(Tone.Synth).toDestination();
        
        let activeNotes = { "Left": null, "Right": null };

        document.getElementById('startBtn').onclick = async () => {
            await Tone.start();
            document.getElementById('startBtn').style.display = 'none';
            startCamera();
        };

        function onResults(results) {
            canvasElement.width = results.image.width;
            canvasElement.height = results.image.height;
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (!results.multiHandLandmarks) {
                releaseAll();
                return;
            }

            for (let i = 0; i < results.multiHandLandmarks.length; i++) {
                const landmarks = results.multiHandLandmarks[i];
                const handedness = results.multiHandedness[i].label; // Left o Right
                
                // Dibujar puntos y líneas
                drawHand(landmarks, handedness);

                // Lógica de dedo estirado
                const isExtended = Math.hypot(landmarks[8].x - landmarks[0].x, landmarks[8].y - landmarks[0].y) > 
                                   (Math.hypot(landmarks[5].x - landmarks[0].x, landmarks[5].y - landmarks[0].y) * 1.5);

                if (isExtended) {
                    let note = ["C3","D3","E3","G3","A3","C4","D4","E4","G4","A4"][Math.floor((1 - landmarks[8].y) * 10)];
                    playNote(handedness, note);
                } else {
                    stopNote(handedness);
                }
            }
        }

        function drawHand(landmarks, side) {
            canvasCtx.strokeStyle = (side === 'Left') ? '#00FF88' : '#FF3366';
            canvasCtx.lineWidth = 3;
            // Dibujar líneas básicas entre puntos (índice, medio, anular, meñique)
            [[8,6], [6,5], [5,0], [12,10], [10,9], [9,0]].forEach(conn => {
                canvasCtx.beginPath();
                canvasCtx.moveTo(landmarks[conn[0]].x * canvasElement.width, landmarks[conn[0]].y * canvasElement.height);
                canvasCtx.lineTo(landmarks[conn[1]].x * canvasElement.width, landmarks[conn[1]].y * canvasElement.height);
                canvasCtx.stroke();
            });
        }

        function playNote(side, note) {
            if (activeNotes[side] !== note) {
                if (activeNotes[side]) (side === 'Left' ? synthLeft : synthRight).triggerRelease(activeNotes[side]);
                (side === 'Left' ? synthLeft : synthRight).triggerAttack(note);
                activeNotes[side] = note;
            }
        }

        function stopNote(side) {
            if (activeNotes[side]) {
                (side === 'Left' ? synthLeft : synthRight).triggerRelease(activeNotes[side]);
                activeNotes[side] = null;
            }
        }

        function releaseAll() {
            synthLeft.releaseAll(); synthRight.releaseAll();
            activeNotes = { "Left": null, "Right": null };
        }

        const hands = new Hands({locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
        hands.setOptions({ maxNumHands: 2, modelComplexity: 1 });
        hands.onResults(onResults);

        function startCamera() {
            new Camera(document.getElementById('input_video'), { 
                onFrame: async () => await hands.send({image: document.getElementById('input_video')}),
            }).start();
        }
    </script>
</body>
</html>
