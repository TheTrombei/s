<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Espectrógrafo - CulturaCrítica</title>
    <!-- Agregamos los utils de dibujo de MediaPipe -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; }
        #startBtn { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); padding: 20px; z-index: 10; font-weight: bold; }
        #output_canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; transform: scaleX(-1); }
    </style>
</head>
<body>
    <button id="startBtn">INICIAR SINTETIZADOR</button>
    <video id="input_video" style="display:none;"></video>
    <canvas id="output_canvas"></canvas>

    <script>
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const synthRight = new Tone.Synth().toDestination();
        const synthLeft = new Tone.Synth().toDestination();
        
        let activeNotes = { "Left": null, "Right": null };

        document.getElementById('startBtn').onclick = async () => {
            await Tone.start();
            document.getElementById('startBtn').style.display = 'none';
            startCamera();
        };

        function onResults(results) {
            canvasElement.width = results.image.width;
            canvasElement.height = results.image.height;
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            // SI NO HAY MANOS, SILENCIO TOTAL
            if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
                if(activeNotes["Left"]) { synthLeft.triggerRelease(); activeNotes["Left"] = null; }
                if(activeNotes["Right"]) { synthRight.triggerRelease(); activeNotes["Right"] = null; }
                return;
            }

            // DIBUJO PROFESIONAL CON LA LIBRERÍA DE GOOGLE
            for (const landmarks of results.multiHandLandmarks) {
                drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#00FF88', lineWidth: 5});
                drawLandmarks(canvasCtx, landmarks, {color: '#FF0000', lineWidth: 2});
            }

            // LÓGICA DE SONIDO
            for (let i = 0; i < results.multiHandLandmarks.length; i++) {
                const landmarks = results.multiHandLandmarks[i];
                const handedness = results.multiHandedness[i].label;
                const isExtended = (landmarks[8].y < landmarks[6].y); // Dedo índice estirado

                if (isExtended) {
                    let note = ["C3","D3","E3","G3","A3","C4","D4","E4","G4","A4"][Math.floor((1 - landmarks[8].y) * 10)];
                    playNote(handedness, note);
                } else {
                    stopNote(handedness);
                }
            }
        }

        function playNote(side, note) {
            if (activeNotes[side] !== note) {
                if (activeNotes[side]) (side === 'Left' ? synthLeft : synthRight).triggerRelease();
                (side === 'Left' ? synthLeft : synthRight).triggerAttack(note);
                activeNotes[side] = note;
            }
        }

        function stopNote(side) {
            if (activeNotes[side]) {
                (side === 'Left' ? synthLeft : synthRight).triggerRelease();
                activeNotes[side] = null;
            }
        }

        const hands = new Hands({locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
        hands.setOptions({ maxNumHands: 2, modelComplexity: 1 });
        hands.onResults(onResults);

        function startCamera() {
            new Camera(document.getElementById('input_video'), { 
                onFrame: async () => await hands.send({image: document.getElementById('input_video')}),
            }).start();
        }
    </script>
</body>
</html>
