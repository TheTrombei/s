<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Espectrógrafo Dual - CulturaCrítica</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <style>
        body { margin: 0; background-color: #121212; color: #00FF88; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; }
        #startBtn { padding: 20px 40px; font-size: 1.5rem; background-color: #00FF88; color: black; border: none; border-radius: 12px; cursor: pointer; z-index: 10; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; transform: scaleX(-1); }
        #status { position: absolute; top: 20px; z-index: 10; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 10px; border: 1px solid #00FF88; }
    </style>
</head>
<body>
    <div id="status">Presiona el botón para iniciar</div>
    <button id="startBtn">INICIAR ESPECTRÓGRAFO DUAL</button>
    <video id="input_video" style="display:none;"></video>
    <canvas id="output_canvas"></canvas>

    <script>
        // 1. Dos sintetizadores distintos
        let synthRight = new Tone.Synth({ oscillator: { type: 'square' } }).toDestination();
        let synthLeft = new Tone.Synth({ oscillator: { type: 'triangle' }, envelope: { attack: 0.2, release: 1 } }).toDestination();
        
        let isRightPlaying = false;
        let isLeftPlaying = false;

        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const startBtn = document.getElementById('startBtn');

        startBtn.addEventListener('click', async () => {
            await Tone.start();
            startBtn.style.display = 'none';
            startCamera();
        });

        function onResults(results) {
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            // Reiniciamos estados si no detecta nada
            if (!results.multiHandLandmarks) {
                if(isRightPlaying) { synthRight.triggerRelease(); isRightPlaying = false; }
                if(isLeftPlaying) { synthLeft.triggerRelease(); isLeftPlaying = false; }
                return;
            }

            // 2. Iteramos sobre las manos detectadas
            for (let i = 0; i < results.multiHandLandmarks.length; i++) {
                const landmarks = results.multiHandLandmarks[i];
                const handedness = results.multiHandedness[i].label; // "Left" o "Right"
                
                // Lógica de detección (Dedo índice estirado)
                const distTipToWrist = Math.hypot(landmarks[8].x - landmarks[0].x, landmarks[8].y - landmarks[0].y);
                const distBaseToWrist = Math.hypot(landmarks[5].x - landmarks[0].x, landmarks[5].y - landmarks[0].y);
                const isExtended = distTipToWrist > (distBaseToWrist * 1.2);

                if (handedness === 'Left') { // Ajusta si te sale invertido
                    if (isExtended) {
                        let freq = 200 + (landmarks[8].y * 200); // Tono grave
                        synthLeft.frequency.rampTo(freq, 0.1);
                        if (!isLeftPlaying) { synthLeft.triggerAttack(freq); isLeftPlaying = true; }
                    } else if (isLeftPlaying) { synthLeft.triggerRelease(); isLeftPlaying = false; }
                } else {
                    if (isExtended) {
                        let freq = 400 + (landmarks[8].y * 400); // Tono agudo
                        synthRight.frequency.rampTo(freq, 0.1);
                        if (!isRightPlaying) { synthRight.triggerAttack(freq); isRightPlaying = true; }
                    } else if (isRightPlaying) { synthRight.triggerRelease(); isRightPlaying = false; }
                }
            }
        }

        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({ maxNumHands: 2, modelComplexity: 1 });
        hands.onResults(onResults);

        function startCamera() {
            new Camera(videoElement, { onFrame: async () => await hands.send({image: videoElement}), width: 640, height: 480 }).start();
        }
    </script>
</body>
</html>
