<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sintetizador Pro - CulturaCrítica</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; }
        #startBtn { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); 
            padding: 25px 50px; background: #00FF88; color: black; font-weight: bold; 
            border: none; border-radius: 15px; cursor: pointer; z-index: 10; font-size: 1.2rem;
        }
        #output_canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; transform: scaleX(-1); }
        #status { position: absolute; top: 20px; left: 20px; color: #fff; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 8px; z-index: 5; font-weight: bold; border: 1px solid #00FF88; }
    </style>
</head>
<body>
    <div id="status">Presiona para cargar...</div>
    <button id="startBtn">INICIAR SINTETIZADOR PRO</button>
    <video id="input_video" style="display:none;" playsinline></video>
    <canvas id="output_canvas"></canvas>

    <script>
        const statusTxt = document.getElementById('status');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const videoElement = document.getElementById('input_video');
        
        // --- 1. SONIDO PROFESIONAL ---
        const reverb = new Tone.Freeverb({ roomSize: 0.8, dampening: 2000 }).toDestination();
        const filter = new Tone.Filter(800, "lowpass").connect(reverb);

        const synthLeft = new Tone.PolySynth(Tone.Synth, {
            oscillator: { type: "triangle" },
            envelope: { attack: 0.2, decay: 0.1, sustain: 0.9, release: 1.5 }
        }).connect(filter);

        const synthRight = new Tone.PolySynth(Tone.FMSynth, {
            oscillator: { type: "sine" },
            envelope: { attack: 0.3, decay: 0.1, sustain: 0.8, release: 2 }
        }).connect(filter);

        // --- 2. BANCO DE ACORDES ---
        const chords = {
            1: ["C3", "E3", "G3"], 2: ["D3", "F3", "A3"], 3: ["E3", "G3", "B3"], 
            4: ["F3", "A3", "C4"], 5: ["G3", "B3", "D4"]
        };

        let activeChords = { "Left": null, "Right": null };

        document.getElementById('startBtn').onclick = async () => {
            await Tone.start();
            document.getElementById('startBtn').style.display = 'none';
            statusTxt.innerText = "IA Cargada. Mueve tus manos.";
            new Camera(videoElement, { onFrame: async () => await hands.send({image: videoElement}) }).start();
        };

        // --- 3. LÓGICA DE DEDOS ---
        function onResults(results) {
            canvasElement.width = results.image.width;
            canvasElement.height = results.image.height;
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (!results.multiHandLandmarks) {
                releaseAll();
                return;
            }

            for (let i = 0; i < results.multiHandLandmarks.length; i++) {
                const landmarks = results.multiHandLandmarks[i];
                const handedness = results.multiHandedness[i].label;
                
                // Dibujo profesional
                drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#00FF88', lineWidth: 4});
                
                // Contar dedos levantados (usando la punta vs nudillo)
                let count = 0;
                if (landmarks[8].y < landmarks[6].y) count++; // Índice
                if (landmarks[12].y < landmarks[10].y) count++; // Medio
                if (landmarks[16].y < landmarks[14].y) count++; // Anular
                if (landmarks[20].y < landmarks[18].y) count++; // Meñique

                // Reproducir acorde
                if (count > 0 && count <= 5) {
                    let chord = chords[count];
                    playChord(handedness, chord);
                } else {
                    stopChord(handedness);
                }
            }
        }

        function playChord(side, chord) {
            if (activeChords[side] !== JSON.stringify(chord)) {
                if (activeChords[side]) (side === 'Left' ? synthLeft : synthRight).triggerRelease(JSON.parse(activeChords[side]));
                (side === 'Left' ? synthLeft : synthRight).triggerAttack(chord);
                activeChords[side] = JSON.stringify(chord);
            }
        }

        function stopChord(side) {
            if (activeChords[side]) {
                (side === 'Left' ? synthLeft : synthRight).triggerRelease(JSON.parse(activeChords[side]));
                activeChords[side] = null;
            }
        }

        function releaseAll() {
            synthLeft.releaseAll(); synthRight.releaseAll();
            activeChords = { "Left": null, "Right": null };
        }

        const hands = new Hands({locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
        hands.setOptions({ maxNumHands: 2, modelComplexity: 1 });
        hands.onResults(onResults);
    </script>
</body>
</html>
